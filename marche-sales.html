<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7c9d8"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="猫の売上帳"><title>猫のかんたん売上帳</title><link rel="stylesheet" href="./marche-sales.css?v=20260820d"><style>.cat-logo{width:68px;height:68px;object-fit:contain;object-position:center;border-radius:18px;border:2px solid #f7c9d8;background:#fff7f4;box-shadow:0 4px 12px rgba(67,42,49,.12);flex:0 0 auto}</style></head><body><main class="app"><header class="brand"><img class="cat-logo" src="./chatora-face2.jpg?v=20260820d" alt="茶トラの猫"><div><h1>猫のかんたん売上帳</h1><div class="sub" id="date"></div></div></header><section id="sales" class="view active"><div class="hero"><div class="hero-label">きょうの売上</div><div class="amount" id="total">¥0</div><div class="pay-split"><div class="mini cash">現金<strong id="cash">¥0</strong></div><div class="mini paypay">PayPay<strong id="paypay">¥0</strong></div></div><div class="stats"><span id="count">0件</span></div></div><div class="section-title">商品を押してね <span class="paw">🐾</span></div><div class="products" id="grid"></div></section><section id="history" class="view"><div class="panel"><h2>売上の履歴</h2><p class="helper">日付を押すと、売れたものを1件ずつ確認できるよ。</p><button class="big-btn" id="csv" type="button">CSVで保存する</button></div><div id="hist"></div></section><section id="settings" class="view"><div class="panel"><h2>商品の設定</h2><p class="helper">商品名と値段を変えられるよ。原価・在庫は空欄でもOK。</p><button class="big-btn secondary" id="add" type="button">＋ 商品を追加する</button></div><div class="settings-list" id="settingsList"></div></section></main><nav class="nav" aria-label="メインメニュー"><button data-v="sales" class="active" type="button">売上</button><button data-v="history" type="button">履歴</button><button data-v="settings" type="button">設定</button></nav><div class="sheet-bg" id="paybg" role="dialog" aria-modal="true"><div class="sheet"><div class="chosen" id="chosen"></div><div class="chosen-price" id="chosenPrice"></div><button class="pay-btn cash" data-pay="cash" type="button">現金</button><button class="pay-btn paypay" data-pay="paypay" type="button">PayPay</button><button class="cancel-btn" id="cancel" type="button">やめる</button></div></div><div class="dialog-bg" id="editbg" role="dialog" aria-modal="true"><form class="dialog" id="form"><h2 id="editTitle">商品を編集</h2><input type="hidden" id="pid"><label for="pname">商品名</label><input id="pname" required maxlength="30"><label for="price">値段（円）</label><input id="price" type="number" min="0" inputmode="numeric" required><label for="cost">原価（円・任意）</label><input id="cost" type="number" min="0" inputmode="numeric" placeholder="空欄でOK"><label for="stock">今日の在庫数（任意）</label><input id="stock" type="number" min="0" inputmode="numeric" placeholder="空欄でOK"><div class="form-actions"><button class="close" id="close" type="button">やめる</button><button class="save" type="submit">保存する</button></div><button class="danger-btn" id="deleteProduct" type="button">この商品を削除</button></form></div><div class="toast" id="toast" role="status" aria-live="polite">🐱 売れたよ！</div><script src="./marche-sales.js?v=20260820d"></script></body></html>
