<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6c8d7"><title>猫のかんたん売上帳</title><style>:root{--bg:#fffaf7;--card:#fff;--text:#332b2d;--sub:#6c5d62;--pink:#f6c8d7;--pink2:#a94669;--mint:#ccebdd;--mint2:#286a55;--line:#eadde1}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}body{font-size:19px}.app{max-width:520px;margin:auto;min-height:100dvh;padding:14px 14px 92px}header{display:flex;align-items:center;gap:10px;margin:2px 0 14px}.cat{width:52px;height:46px;color:var(--pink2)}h1{font-size:25px;margin:0;line-height:1.2}.date{font-size:15px;color:var(--sub);font-weight:700}.hero{background:#fff;border:2px solid var(--line);border-radius:26px;padding:20px 16px;text-align:center}.label{font-size:21px;font-weight:900}.total{font-size:48px;font-weight:900;line-height:1.05;margin:8px 0 13px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{border-radius:18px;padding:11px 7px;font-weight:900}.mini.cash{background:var(--mint)}.mini.pay{background:var(--pink)}.mini strong{display:block;font-size:23px}.count{margin-top:11px;font-size:17px;color:var(--sub);font-weight:800}.sec{font-size:23px;font-weight:900;margin:21px 3px 11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.prod{min-height:126px;border:2px solid var(--line);border-radius:23px;background:#fff;color:var(--text);padding:12px 8px;font-weight:900}.prod .n{font-size:20px;line-height:1.25}.prod .p{font-size:27px;color:var(--pink2);margin-top:7px}.prod .s{font-size:15px;color:var(--sub);margin-top:5px}.undo,.wide{width:100%;min-height:62px;border-radius:19px;font-size:20px;font-weight:900}.undo{margin-top:16px;border:2px solid #e4c4cc;background:#fff;color:#963d50}.undo:disabled{opacity:.4}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:rgba(255,250,247,.97);border-top:1px solid var(--line)}.nav button{min-height:60px;border:0;border-radius:18px;background:transparent;font-size:17px;font-weight:900;color:var(--sub)}.nav button.on{background:var(--pink);color:#6b3044}.view{display:none}.view.on{display:block}.panel{background:#fff;border:2px solid var(--line);border-radius:23px;padding:15px;margin-bottom:13px}.panel h2{font-size:25px;margin:0 0 11px}.wide{border:0;background:var(--mint);color:#204e40}.add{background:var(--pink);color:#6b3044}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;border:2px solid var(--line);background:#fff;border-radius:18px;padding:12px;margin-bottom:9px}.row .n{font-size:19px;font-weight:900}.row .p{font-size:17px;color:var(--sub);font-weight:800}.edit{min-height:52px;min-width:74px;border:0;border-radius:15px;background:#ffe7a8;font-weight:900}.hist{width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:20px;padding:15px;margin-bottom:10px;color:var(--text)}.hist .d{font-size:20px;font-weight:900}.hist .t{font-size:30px;font-weight:900}.hist .m{font-size:16px;color:var(--sub);font-weight:700}.det{display:none;margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}.det.open{display:block}.dr{display:flex;justify-content:space-between;padding:6px 0;font-weight:700}.empty{text-align:center;padding:30px 10px;color:var(--sub);font-weight:800}.back,.dialogbg{position:fixed;inset:0;background:rgba(33,25,28,.42);display:none;z-index:50}.back.open,.dialogbg.open{display:flex}.back{align-items:flex-end;justify-content:center}.sheet{width:min(520px,100%);background:#fff;border-radius:28px 28px 0 0;padding:21px 17px calc(20px + env(safe-area-inset-bottom));text-align:center}.chosen{font-size:22px;font-weight:900}.chosenp{font-size:34px;font-weight:900;color:var(--pink2);margin:5px 0 13px}.paybtn{width:100%;min-height:72px;border:0;border-radius:20px;margin-top:9px;font-size:24px;font-weight:900}.cashbtn{background:var(--mint);color:#204e40}.paypaybtn{background:var(--pink);color:#6b3044}.cancel{width:100%;min-height:56px;border:0;background:transparent;font-weight:900;color:var(--sub)}.dialogbg{align-items:center;justify-content:center;padding:17px}.dialog{width:min(460px,100%);max-height:88dvh;overflow:auto;background:#fff;border-radius:25px;padding:17px}.dialog h2{font-size:24px;margin:0 0 12px}label{display:block;font-size:17px;font-weight:900;margin:11px 0 5px}input{width:100%;min-height:57px;border:2px solid var(--line);border-radius:15px;padding:9px 11px;font-size:20px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:15px}.actions button,.delete{min-height:58px;border:0;border-radius:16px;font-weight:900}.save{background:var(--mint);color:#204e40}.close{background:#f2ecef}.delete{width:100%;margin-top:9px;border:2px solid #e4b7c0;background:#fff;color:#963d50}.toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-130%);background:#fff;border:2px solid var(--pink);border-radius:20px;padding:12px 18px;font-size:21px;font-weight:900;z-index:80;transition:.2s}.toast.show{transform:translate(-50%,0)}button:focus-visible,input:focus{outline:4px solid rgba(40,106,85,.25);outline-offset:2px}@media(max-width:350px){.total{font-size:42px}.prod .n{font-size:18px}.prod .p{font-size:24px}}</style></head><body><main class="app"><header><svg class="cat" viewBox="0 0 64 56" aria-hidden="true"><path d="M12 22 10 6 24 15Z" fill="currentColor"/><path d="M52 22 54 6 40 15Z" fill="currentColor"/><ellipse cx="32" cy="32" rx="24" ry="21" fill="currentColor"/><circle cx="23" cy="30" r="3" fill="#fffaf7"/><circle cx="41" cy="30" r="3" fill="#fffaf7"/><path d="M28 37q4 5 8 0" stroke="#fffaf7" stroke-width="3" fill="none" stroke-linecap="round"/></svg><div><h1>猫のかんたん売上帳</h1><div class="date" id="date"></div></div></header><section id="sales" class="view on"><div class="hero"><div class="label">きょうの売上</div><div class="total" id="total">¥0</div><div class="split"><div class="mini cash">現金<strong id="cash">¥0</strong></div><div class="mini pay">PayPay<strong id="paypay">¥0</strong></div></div><div class="count" id="count">0件</div></div><div class="sec">商品を押してね 🐾</div><div class="grid" id="grid"></div><button class="undo" id="undo">↶ 1件もどす</button></section><section id="history" class="view"><div class="panel"><h2>売上の履歴</h2><button class="wide" id="csv">CSVで保存する</button></div><div id="hist"></div></section><section id="settings" class="view"><div class="panel"><h2>商品の設定</h2><button class="wide add" id="add">＋ 商品を追加する</button></div><div id="settingsList"></div></section></main><nav class="nav"><button data-v="sales" class="on">売上</button><button data-v="history">履歴</button><button data-v="settings">設定</button></nav><div class="back" id="paybg"><div class="sheet"><div class="chosen" id="chosen"></div><div class="chosenp" id="chosenp"></div><button class="paybtn cashbtn" data-pay="cash">現金</button><button class="paybtn paypaybtn" data-pay="paypay">PayPay</button><button class="cancel" id="cancel">やめる</button></div></div><div class="dialogbg" id="editbg"><form class="dialog" id="form"><h2 id="etitle">商品を編集</h2><input type="hidden" id="pid"><label for="pname">商品名</label><input id="pname" required maxlength="30"><label for="price">値段（円）</label><input id="price" type="number" min="0" inputmode="numeric" required><label for="cost">原価（円・任意）</label><input id="cost" type="number" min="0" inputmode="numeric"><label for="stock">今日の在庫数（任意）</label><input id="stock" type="number" min="0" inputmode="numeric"><div class="actions"><button class="close" id="close" type="button">やめる</button><button class="save" type="submit">保存する</button></div><button class="delete" id="delete" type="button">この商品を削除</button></form></div><div class="toast" id="toast">🐱 売れたよ！</div><script>(()=>{const K='neko-uriage-v3',D=[{id:'p1',name:'アンブレラマーカー',price:500,cost:null,stock:null},{id:'p2',name:'ノアにゃん',price:500,cost:null,stock:null},{id:'p3',name:'せんべい',price:300,cost:null,stock:null},{id:'p4',name:'その他',price:500,cost:null,stock:null}];let x=load(),sel=null,timer;const $=i=>document.getElementById(i),yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP'),day=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,nice=k=>{const[y,m,d]=k.split('-').map(Number),z=new Date(y,m-1,d);return`${m}月${d}日 (${['日','月','火','水','木','金','土'][z.getDay()]})`},esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function load(){try{const r=localStorage.getItem(K);if(r){const q=JSON.parse(r);return{products:Array.isArray(q.products)&&q.products.length?q.products:D,sales:Array.isArray(q.sales)?q.sales:[]}}}catch(e){}return{products:D,sales:[]}}function save(){localStorage.setItem(K,JSON.stringify(x))}function ts(){return x.sales.filter(s=>s.day===day())}function sum(a){let cash=0,paypay=0,cost=0,all=a.length>0,map={};a.forEach(s=>{s.method==='cash'?cash+=s.price:paypay+=s.price;if(typeof s.cost==='number')cost+=s.cost;else all=false;(map[s.name]??={name:s.name,count:0,total:0}).count++;map[s.name].total+=s.price});return{total:cash+paypay,cash,paypay,count:a.length,profit:all?cash+paypay-cost:null,by:Object.values(map)}}function sold(id){return ts().filter(s=>s.productId===id).length}function toast(m){$('toast').textContent='🐱 '+m;$('toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.remove('show'),1400)}function render(){const s=sum(ts());$('date').textContent=nice(day());$('total').textContent=yen(s.total);$('cash').textContent=yen(s.cash);$('paypay').textContent=yen(s.paypay);$('count').textContent=s.count+'件'+(s.profit!==null?' ・ 利益 '+yen(s.profit):'');$('undo').disabled=!s.count;$('grid').innerHTML=x.products.map(p=>`<button class="prod" data-prod="${esc(p.id)}"><div class="n">${esc(p.name)}</div><div class="p">${yen(p.price)}</div>${Number.isInteger(p.stock)?`<div class="s">残り ${Math.max(0,p.stock-sold(p.id))}個</div>`:''}</button>`).join('');$('settingsList').innerHTML=x.products.map(p=>`<div class="row"><div><div class="n">${esc(p.name)}</div><div class="p">${yen(p.price)}</div></div><button class="edit" data-edit="${esc(p.id)}">編集</button></div>`).join('');renderHist()}function renderHist(){let g={};x.sales.forEach(s=>(g[s.day]??=[]).push(s));const ds=Object.keys(g).sort().reverse();$('hist').innerHTML=ds.length?ds.map(d=>{const s=sum(g[d]),rows=s.by.map(r=>`<div class="dr"><span>${esc(r.name)} × ${r.count}</span><strong>${yen(r.total)}</strong></div>`).join('');return`<button class="hist" data-h="${d}"><div class="d">${nice(d)}</div><div class="t">${yen(s.total)}</div><div class="m">${s.count}件 ・ 現金 ${yen(s.cash)} ・ PayPay ${yen(s.paypay)}</div><div class="det" id="det-${d}">${rows}</div></button>`}).join(''):'<div class="empty">まだ売上はないよ</div>'}document.addEventListener('click',e=>{const b=e.target.closest('[data-prod]');if(b){sel=x.products.find(p=>p.id===b.dataset.prod);if(!sel)return;$('chosen').textContent=sel.name;$('chosenp').textContent=yen(sel.price);$('paybg').classList.add('open');return}const p=e.target.closest('[data-pay]');if(p&&sel){const n=new Date();x.sales.push({id:Date.now()+'-'+Math.random(),productId:sel.id,name:sel.name,price:sel.price,cost:typeof sel.cost==='number'?sel.cost:null,method:p.dataset.pay,at:n.toISOString(),day:day(n)});save();$('paybg').classList.remove('open');sel=null;toast('売れたよ！');render();return}const ed=e.target.closest('[data-edit]');if(ed){openEdit(ed.dataset.edit);return}const h=e.target.closest('[data-h]');if(h){$('det-'+h.dataset.h).classList.toggle('open')}});$('cancel').onclick=()=>{$('paybg').classList.remove('open');sel=null};$('paybg').onclick=e=>{if(e.target===$('paybg'))$('cancel').click()};$('undo').onclick=()=>{const a=ts();if(!a.length)return;const last=a[a.length-1],i=x.sales.map(s=>s.id).lastIndexOf(last.id);if(i>=0)x.sales.splice(i,1);save();toast('1件もどしたよ');render()};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(n=>n.classList.remove('on'));document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));b.classList.add('on');$(b.dataset.v).classList.add('on');scrollTo(0,0)});function openEdit(id){const p=id?x.products.find(q=>q.id===id):null;$('etitle').textContent=p?'商品を編集':'商品を追加';$('pid').value=p?.id||'';$('pname').value=p?.name||'';$('price').value=p?.price??'';$('cost').value=Number.isInteger(p?.cost)?p.cost:'';$('stock').value=Number.isInteger(p?.stock)?p.stock:'';$('delete').style.display=p?'block':'none';$('editbg').classList.add('open')}function close(){ $('editbg').classList.remove('open') }$('add').onclick=()=>openEdit();$('close').onclick=close;$('editbg').onclick=e=>{if(e.target===$('editbg'))close()};$('form').onsubmit=e=>{e.preventDefault();const id=$('pid').value,o={id:id||'p-'+Date.now(),name:$('pname').value.trim(),price:Math.max(0,+$('price').value||0),cost:$('cost').value===''?null:Math.max(0,+$('cost').value||0),stock:$('stock').value===''?null:Math.max(0,Math.floor(+$('stock').value||0))};if(id){const i=x.products.findIndex(p=>p.id===id);if(i>=0)x.products[i]=o}else x.products.push(o);save();close();toast('保存したよ');render()};$('delete').onclick=()=>{const id=$('pid').value;if(!id)return;x.products=x.products.filter(p=>p.id!==id);if(!x.products.length)x.products=D;save();close();toast('削除したよ');render()};$('csv').onclick=()=>{if(!x.sales.length){toast('まだ売上がないよ');return}const rows=[['日付','時刻','商品名','金額','支払い方法']];x.sales.forEach(s=>{const d=new Date(s.at);rows.push([s.day,`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`,s.name,String(s.price),s.method==='cash'?'現金':'PayPay'])});const csv='\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),u=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='うりあげ-'+day()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)};render()})()</script></body></html>
